<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>Pasteboard</title>
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Bebas+Neue&family=Bricolage+Grotesque:wght@400;600;800&family=Caveat:wght@500;700&family=DM+Serif+Display&family=Instrument+Sans:wght@400;500;600;700&family=JetBrains+Mono:wght@400;500&family=Lora:ital,wght@0,400;0,700;1,400&family=Montserrat:wght@400;600;800&family=Oswald:wght@400;600&family=Pacifico&family=Playfair+Display:ital,wght@0,400;0,700;1,400&family=Space+Mono:wght@400;700&display=swap">
<style>
/* Layout: tool rail | canvas stage with page strip | tabbed inspector. Narrow screens stack them. */
:root{
  --bg:#EEF0F3; --panel:#FFFFFF; --panel2:#F5F6F8; --line:#D8DCE3; --ink:#1B1F27; --ink2:#5B6471;
  --accent:#E5530F; --accent-ink:#FFFFFF; --accent-soft:#FDE9DE; --stage:#DCE0E6; --focus:#2C6BE8; --danger:#C62F2F;
  --shadow:0 1px 2px rgba(20,28,40,.08),0 8px 24px rgba(20,28,40,.10);
  --ui:"Instrument Sans",system-ui,-apple-system,"Segoe UI",sans-serif;
  --display:"Bricolage Grotesque","Instrument Sans",system-ui,sans-serif;
  --mono:"JetBrains Mono",ui-monospace,Menlo,Consolas,monospace;
}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]){
  --bg:#13161B; --panel:#1B1F26; --panel2:#232831; --line:#303743; --ink:#E8EBF0; --ink2:#9AA3B2;
  --accent:#FF7A3D; --accent-ink:#1A0E07; --accent-soft:#3A2418; --stage:#0E1013; --focus:#6FA0FF; --danger:#FF6B6B;
  --shadow:0 1px 2px rgba(0,0,0,.4),0 8px 24px rgba(0,0,0,.45); color-scheme:dark}}
:root[data-theme="dark"]{
  --bg:#13161B; --panel:#1B1F26; --panel2:#232831; --line:#303743; --ink:#E8EBF0; --ink2:#9AA3B2;
  --accent:#FF7A3D; --accent-ink:#1A0E07; --accent-soft:#3A2418; --stage:#0E1013; --focus:#6FA0FF; --danger:#FF6B6B;
  --shadow:0 1px 2px rgba(0,0,0,.4),0 8px 24px rgba(0,0,0,.45); color-scheme:dark}

*{box-sizing:border-box}
html,body{height:100%}
body{margin:0;background:var(--bg);color:var(--ink);font:13px/1.4 var(--ui);overflow:hidden;
  padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px));padding-block:0}
button,input,select,textarea{font:inherit;color:inherit}
button{cursor:pointer}
:focus-visible{outline:2px solid var(--focus);outline-offset:1px}
.ic{width:18px;height:18px;fill:none;stroke:currentColor;stroke-width:1.8;stroke-linecap:round;stroke-linejoin:round;flex:none}
#app{height:100%;display:grid;grid-template-columns:56px minmax(0,1fr) 304px;grid-template-rows:auto minmax(0,1fr) auto;
  grid-template-areas:"top top top" "tools stage side" "tools pages side";gap:0}

/* top bar */
#top{grid-area:top;display:flex;align-items:center;gap:8px;padding:8px 0;min-width:0;overflow-x:auto;scrollbar-width:none}
#top::-webkit-scrollbar{display:none}
.brand{font:800 18px/1 var(--display);letter-spacing:-.02em;display:flex;align-items:center;gap:7px;margin-right:6px;white-space:nowrap}
.brand i{width:14px;height:14px;border-radius:3px;background:var(--accent);display:block;transform:rotate(12deg)}
#docName{width:180px;min-width:110px;background:transparent;border:1px solid transparent;border-radius:6px;padding:6px 8px;font-weight:600}
#docName:hover{border-color:var(--line)} #docName:focus{border-color:var(--focus);background:var(--panel)}
.sp{flex:1}
.grp{display:flex;align-items:center;gap:2px;background:var(--panel);border:1px solid var(--line);border-radius:8px;padding:2px;flex:none}
.btn{display:inline-flex;align-items:center;justify-content:center;gap:6px;height:30px;min-width:30px;padding:0 9px;border:1px solid transparent;
  background:transparent;border-radius:6px;white-space:nowrap}
.btn:hover:not(:disabled){background:var(--panel2)}
.btn:disabled{opacity:.4;cursor:default}
.btn.line{border-color:var(--line);background:var(--panel)}
.btn.primary{background:var(--accent);color:var(--accent-ink);font-weight:600}
.btn.primary:hover:not(:disabled){background:var(--accent);filter:brightness(1.07)}
.btn.on{background:var(--accent-soft);color:var(--accent)}
.btn.danger{color:var(--danger)}
#zoomLabel{width:48px;text-align:center;font:500 12px var(--mono);border:0;background:transparent}
#saveState{font-size:12px;color:var(--ink2);white-space:nowrap;min-width:64px}

/* tool rail */
#tools{grid-area:tools;display:flex;flex-direction:column;gap:4px;padding:6px 0;align-items:center}
#tools .btn{width:40px;height:40px;border-radius:9px}
#tools .btn.on{background:var(--accent);color:var(--accent-ink)}
#tools hr{width:24px;border:0;border-top:1px solid var(--line);margin:4px 0}

/* stage */
#stage{grid-area:stage;background:var(--stage);border:1px solid var(--line);border-radius:10px;overflow:auto;display:flex;position:relative;
  min-width:0;min-height:0;padding:var(--pad,56px)}
#stage{--pad:56px}
#board{margin:auto;position:relative;flex:none;box-shadow:var(--shadow)}
#board canvas{position:absolute;left:0;top:0;display:block}
#cv{background:repeating-conic-gradient(#d9d9d9 0 25%,#fff 0 50%) 0 0/16px 16px}
#ov{touch-action:none}
#edit{position:absolute;display:none;margin:0;padding:0;border:0;outline:none;opacity:0;pointer-events:none;color:transparent;caret-color:transparent;background:transparent;resize:none;overflow:hidden;
  white-space:pre-wrap;word-break:break-word;transform-origin:50% 50%;z-index:3}
#drop{position:absolute;inset:8px;border:2px dashed var(--accent);border-radius:10px;display:none;align-items:center;justify-content:center;
  background:color-mix(in srgb,var(--panel) 80%,transparent);font:600 15px var(--display);z-index:5;pointer-events:none}
#stage.dragging #drop{display:flex}

/* pages strip */
#pages{grid-area:pages;display:flex;gap:8px;align-items:center;padding:8px 0 8px;overflow-x:auto;min-width:0}
.pg{flex:none;position:relative;border:2px solid var(--line);border-radius:6px;background:var(--panel);padding:0;overflow:hidden;height:52px;display:flex;align-items:center}
.pg.on{border-color:var(--accent)}
.pg canvas{display:block;max-height:48px;max-width:96px}
.pg b{position:absolute;left:3px;bottom:2px;font:500 10px var(--mono);background:var(--panel);padding:0 4px;border-radius:3px}

/* side */
#side{grid-area:side;display:flex;flex-direction:column;min-height:0;min-width:0;background:var(--panel);border:1px solid var(--line);border-radius:10px;margin-left:8px;overflow:hidden}
#tabs{display:flex;border-bottom:1px solid var(--line);flex:none}
#tabs button{flex:1;border:0;background:transparent;padding:10px 4px;display:flex;align-items:center;justify-content:center;gap:6px;color:var(--ink2);border-bottom:2px solid transparent;font-weight:500}
#tabs button.on{color:var(--ink);border-bottom-color:var(--accent)}
#tabs button{font-size:12px;padding:10px 2px}
#tabs .ic{display:none}
.in{width:100%;height:34px;background:var(--panel2);border:1px solid var(--line);border-radius:6px;padding:0 9px;min-width:0}
.sqlbox{width:100%;height:140px;background:var(--panel2);border:1px solid var(--line);border-radius:6px;padding:8px;font:11px/1.4 var(--mono);resize:vertical}
.steps{padding-left:20px;margin:0 0 12px;display:flex;flex-direction:column;gap:6px}
.modal a{color:var(--focus)}
#btnAccount span{max-width:90px;overflow:hidden;text-overflow:ellipsis}
.stk-chips .chip{padding:4px 10px;font-size:12px}
.stk-h{margin:14px 0 8px;font:600 11px var(--ui);letter-spacing:.07em;text-transform:uppercase;color:var(--ink2)}
.stk-grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(56px,1fr));gap:6px}
.stk-grid button{aspect-ratio:1;border:1px solid var(--line);background:var(--panel2);border-radius:9px;padding:5px;display:flex;align-items:center;justify-content:center;font-size:28px;line-height:1}
.stk-grid button:hover{border-color:var(--accent)}
.stk-grid img{width:100%;height:100%;display:block}
.tabbody{overflow:auto;flex:1;min-height:0;padding:12px}
.sec{padding:0 0 14px;margin:0 0 14px;border-bottom:1px solid var(--line)}
.sec:last-child{border-bottom:0;margin-bottom:0}
.sec h4{margin:0 0 8px;font:600 11px var(--ui);letter-spacing:.07em;text-transform:uppercase;color:var(--ink2)}
.row{display:flex;gap:6px;align-items:center;flex-wrap:wrap}
.row+.row{margin-top:8px}
.fld{display:flex;flex-direction:column;gap:2px;flex:1;min-width:56px}
.fld>span{font-size:11px;color:var(--ink2)}
.num,select.sel,input[type=text].txt{width:100%;height:30px;background:var(--panel2);border:1px solid var(--line);border-radius:6px;padding:0 7px;min-width:0}
.num{font-family:var(--mono);font-size:12px}
input[type=color]{width:34px;height:30px;padding:2px;background:var(--panel2);border:1px solid var(--line);border-radius:6px;flex:none}
input[type=range]{flex:1;min-width:60px;accent-color:var(--accent)}
.seg{display:flex;border:1px solid var(--line);border-radius:7px;overflow:hidden;flex:none}
.seg .btn{border-radius:0;height:28px}
.seg .btn+.btn{border-left:1px solid var(--line)}
.hint{color:var(--ink2);font-size:12px;margin:0}
.empty{color:var(--ink2);text-align:center;padding:24px 8px}

/* layers */
.layer{display:flex;align-items:center;gap:6px;padding:5px 6px;border:1px solid transparent;border-radius:7px;margin-bottom:3px;background:var(--panel2)}
.layer.on{border-color:var(--accent);background:var(--accent-soft)}
.layer.over{border-top:2px solid var(--accent)}
.layer .nm{flex:1;min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;cursor:pointer;padding:3px 0}
.layer .btn{height:24px;min-width:24px;padding:0 4px}
.layer.off .nm{opacity:.45}

/* templates */
.tpl{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:10px}
.tpl button{border:1px solid var(--line);background:var(--panel2);border-radius:8px;padding:6px;text-align:left;display:flex;flex-direction:column;gap:5px}
.tpl button:hover{border-color:var(--accent)}
.tpl canvas{width:100%;height:auto;border-radius:4px;display:block}
.tpl span{font-weight:600;font-size:12px}
.tpl small{color:var(--ink2);font:11px var(--mono)}

/* modal + toast */
#modalRoot{position:fixed;inset:0;display:none;align-items:center;justify-content:center;background:rgba(10,14,20,.5);z-index:50;padding:16px}
#modalRoot.open{display:flex}
.modal{background:var(--panel);border:1px solid var(--line);border-radius:12px;box-shadow:var(--shadow);width:min(560px,100%);max-height:calc(100% - 8px);overflow:auto;padding:18px}
.modal h3{margin:0 0 4px;font:800 20px var(--display);letter-spacing:-.01em}
.modal .sub{color:var(--ink2);margin:0 0 14px}
.modal .foot{display:flex;gap:8px;justify-content:flex-end;margin-top:16px;flex-wrap:wrap}
.chips{display:flex;gap:6px;flex-wrap:wrap}
.chip{border:1px solid var(--line);background:var(--panel2);border-radius:999px;padding:5px 12px}
.chip.on{background:var(--accent);color:var(--accent-ink);border-color:var(--accent)}
.sizes{display:grid;grid-template-columns:repeat(auto-fill,minmax(150px,1fr));gap:8px}
.sizes button{border:1px solid var(--line);background:var(--panel2);border-radius:8px;padding:9px 10px;text-align:left}
.sizes button:hover{border-color:var(--accent)}
.sizes b{display:block;font-weight:600}.sizes small{font:11px var(--mono);color:var(--ink2)}
.dlist{display:flex;flex-direction:column;gap:8px}
.ditem{display:flex;gap:10px;align-items:center;border:1px solid var(--line);border-radius:9px;padding:8px;background:var(--panel2)}
.ditem img{width:64px;height:48px;object-fit:contain;background:var(--stage);border-radius:5px;flex:none}
.ditem .meta{flex:1;min-width:0}.ditem .meta b{display:block;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.ditem .meta small{color:var(--ink2);font:11px var(--mono)}
#toast{position:fixed;left:50%;bottom:max(18px,env(safe-area-inset-bottom,0px));transform:translateX(-50%);background:var(--ink);color:var(--bg);padding:9px 14px;border-radius:9px;
  box-shadow:var(--shadow);z-index:60;opacity:0;pointer-events:none;transition:opacity .2s;max-width:calc(100% - 32px)}
#toast.show{opacity:1}

@media (max-width:860px){
  #app{grid-template-columns:minmax(0,1fr);grid-template-rows:auto auto minmax(0,1fr) auto minmax(0,42%);
    grid-template-areas:"top" "tools" "stage" "pages" "side"}
  #tools{flex-direction:row;overflow-x:auto;padding:0 0 6px;justify-content:flex-start}
  #tools .btn{flex:none;width:38px;height:38px}
  #tools hr{width:0;height:24px;border-top:0;border-left:1px solid var(--line);margin:0 4px}
  #side{margin-left:0;margin-top:0}
  #stage{--pad:24px}
  #docName{width:130px}
}
@media (prefers-reduced-motion:reduce){#toast{transition:none}}

[hidden]{display:none!important}
</style>
</head>
<body>

<div id="app">
  <header id="top">
    <div class="brand"><i></i><span id="brandName">Pasteboard</span></div>
    <input id="docName" type="text" aria-label="Design name" value="Untitled design" maxlength="60">
    <div class="grp">
      <button class="btn" id="btnUndo" title="Undo (Ctrl+Z)" aria-label="Undo"><svg class="ic"><use href="#i-undo"/></svg></button>
      <button class="btn" id="btnRedo" title="Redo (Ctrl+Shift+Z)" aria-label="Redo"><svg class="ic"><use href="#i-redo"/></svg></button>
    </div>
    <button class="btn line" id="btnSize" title="Change canvas size"><span id="sizeLabel">1080 × 1080</span></button>
    <div class="grp">
      <button class="btn" id="zoomOut" title="Zoom out" aria-label="Zoom out"><svg class="ic"><use href="#i-minus"/></svg></button>
      <input id="zoomLabel" value="100%" aria-label="Zoom" readonly>
      <button class="btn" id="zoomIn" title="Zoom in" aria-label="Zoom in"><svg class="ic"><use href="#i-plus"/></svg></button>
      <button class="btn" id="zoomFit" title="Fit to screen" aria-label="Fit to screen"><svg class="ic"><use href="#i-fit"/></svg></button>
    </div>
    <span class="sp"></span>
    <span id="saveState" aria-live="polite"></span>
    <button class="btn line" id="btnOpen"><svg class="ic"><use href="#i-folder"/></svg>My designs</button>
    <button class="btn line" id="btnAccount" title="Sign in to save designs online"><svg class="ic"><use href="#i-user"/></svg><span>Sign in</span></button>
    <button class="btn line" id="btnSettings" title="Settings: name, theme, color" aria-label="Settings"><svg class="ic"><use href="#i-gear"/></svg></button>
    <button class="btn line" id="btnSave"><svg class="ic"><use href="#i-save"/></svg>Save</button>
    <button class="btn primary" id="btnExport"><svg class="ic"><use href="#i-download"/></svg>Export</button>
  </header>

  <nav id="tools" aria-label="Tools">
    <button class="btn on" data-tool="select" title="Select (V)" aria-label="Select"><svg class="ic"><use href="#i-select"/></svg></button>
    <button class="btn" data-tool="text" title="Text (T)" aria-label="Text"><svg class="ic"><use href="#i-text"/></svg></button>
    <hr>

/* ---------- cloud accounts (Supabase) ---------- */
const CLOUD_DEFAULT = { url: '', key: '' };   // optional: paste your Supabase URL and key here to bake them into this file
const CLOUD_KEY = 'pb.cloud';
const SB_SRC = 'https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2.45.4/dist/umd/supabase.min.js';
const SETUP_SQL = `create table if not exists designs (
  id text primary key,
  user_id uuid not null default auth.uid() references auth.users on delete cascade,
  name text not null,
  w int, h int, thumb text,
  data jsonb not null,
  updated_at timestamptz not null default now()
);
create table if not exists assets (
  id text not null,
  design_id text not null,
  user_id uuid not null default auth.uid() references auth.users on delete cascade,
  data text not null,
  primary key (design_id, id)
);
alter table designs enable row level security;
alter table assets enable row level security;
drop policy if exists "own designs" on designs;
drop policy if exists "own assets" on assets;
create policy "own designs" on designs for all using (auth.uid() = user_id) with check (auth.uid() = user_id);
create policy "own assets" on assets for all using (auth.uid() = user_id) with check (auth.uid() = user_id);`;
let cloudCfg = { ...CLOUD_DEFAULT };
try { const c = JSON.parse(lsGet(CLOUD_KEY) || '{}'); if (c.url && c.key) cloudCfg = { url: c.url, key: c.key }; } catch (e) { }
let sb = null, cloudUser = null, cloudBusy = false, cloudPending = null;
const cloudSynced = new Map();
const cloudReady = () => !!(sb && cloudUser);
const cloudConfigured = () => /^https:\/\/.+/.test((cloudCfg.url || '').trim()) && !!(cloudCfg.key || '').trim();
const setState = t => { $('#saveState').textContent = t; };
const errText = e => (e && (e.message || e.error_description)) || 'Something went wrong.';

function loadSB() {
  return new Promise((res, rej) => {
    if (window.supabase) return res(window.supabase);
    const s = document.createElement('script'); s.src = SB_SRC;
    s.onload = () => window.supabase ? res(window.supabase) : rej(new Error('The sign-in library did not start.'));
    s.onerror = () => rej(new Error('Could not load the sign-in library. Check your internet connection. (Cloud accounts do not work inside the claude.ai preview.)'));
    document.head.append(s);
  });
}
function updateAccountBtn() {
  const b = $('#btnAccount'); if (!b) return;
  const lbl = cloudUser ? (cloudUser.email || 'Account').split('@')[0].slice(0, 12) : 'Sign in';
  b.querySelector('span').textContent = lbl;
  b.title = cloudUser ? 'Signed in as ' + cloudUser.email : 'Sign in to save designs online';
  b.classList.toggle('on', !!cloudUser);
}
async function cloudInit() {
  updateAccountBtn();
  if (!cloudConfigured()) return;
  try {
    const lib = await loadSB();
    sb = lib.createClient(cloudCfg.url.trim(), cloudCfg.key.trim(), { auth: { persistSession: true, autoRefreshToken: true } });
    const { data } = await sb.auth.getSession(); cloudUser = data.session ? data.session.user : null;
    sb.auth.onAuthStateChange((ev, session) => {
      const was = cloudUser && cloudUser.id; cloudUser = session ? session.user : null;
      setTimeout(() => { updateAccountBtn(); if (cloudUser && cloudUser.id !== was) cloudSync(); }, 0);
    });
  } catch (e) { sb = null; }
  updateAccountBtn(); if (cloudUser) cloudSync();
}
async function cloudSync(thumb) {
  if (!cloudReady() || !doc) return;
  if (cloudBusy) { cloudPending = typeof thumb === 'string' ? thumb : (cloudPending || true); return; }
  cloudBusy = true; setState('Syncing…');
  try {
    const d = doc, s = serialize(), assets = s.assets, rest = { ...s }; delete rest.assets;
    const t = typeof thumb === 'string' ? thumb : makeThumb();
    const up = await sb.from('designs').upsert({ id: d.id, user_id: cloudUser.id, name: d.name, w: d.w, h: d.h, thumb: t, data: rest, updated_at: new Date().toISOString() }, { onConflict: 'id' });
    if (up.error) throw up.error;
    let have = cloudSynced.get(d.id);
    if (!have) { const r = await sb.from('assets').select('id').eq('design_id', d.id); if (r.error) throw r.error; have = new Set(r.data.map(a => a.id)); cloudSynced.set(d.id, have); }
    for (const [id, data] of Object.entries(assets || {})) {
      if (have.has(id)) continue;
      const r = await sb.from('assets').upsert({ id, design_id: d.id, user_id: cloudUser.id, data }, { onConflict: 'design_id,id' });
      if (r.error) throw r.error; have.add(id);
    }
    setState('Saved · cloud');
  } catch (e) {
    console.warn(e); setState('Cloud sync failed');
    if (e && (e.code === '42P01' || /relation .* does not exist|schema cache/i.test(e.message || ''))) toast('Cloud tables are missing. Run the setup code in Supabase (Cloud account → setup).');
  }
  cloudBusy = false;
  if (cloudPending) { const p = cloudPending; cloudPending = null; cloudSync(p === true ? undefined : p); }
}
async function cloudFetchDoc(id) {
  const r = await sb.from('designs').select('id,name,data').eq('id', id).single(); if (r.error) throw r.error;
  const a = await sb.from('assets').select('id,data').eq('design_id', id); if (a.error) throw a.error;
  const assets = {}; a.data.forEach(x => assets[x.id] = x.data);
  cloudSynced.set(id, new Set(Object.keys(assets)));
  return { ...r.data.data, id: r.data.id, name: r.data.name, assets };
}

const toBlob = (c, type, q) => new Promise(r => c.toBlob(r, type, q));
async function renderToCanvas(pg, scale, transparent, opaque) {
  const c = document.createElement('canvas'); c.width = Math.round(doc.w * scale); c.height = Math.round(doc.h * scale);

}
const fname = (n) => (doc.name || 'design').replace(/[^\w\- ]+/g, '').trim().replace(/\s+/g, '-') || 'design';
let exOpt = { fmt: 'png', scale: 1, pages: 'cur', transparent: false, q: 90 };
function openExportModal() {
  closeEdit(); const multi = doc.pages.length > 1;
  const fmts = [['png', 'PNG'], ['jpg', 'JPG'], ['pdf', 'PDF'], ['svg', 'SVG'], ['json', 'Project file']];
  const body = () => {
    const f = exOpt.fmt, ras = f === 'png' || f === 'jpg' || f === 'pdf';
    const maxK = Math.floor(8000 / Math.max(doc.w, doc.h)); if (exOpt.scale > maxK) exOpt.scale = Math.max(1, maxK);
    return `<h3>Export</h3><p class="sub">${esc(doc.name)} · ${doc.pages.length} page${multi ? 's' : ''}</p>
    <div class="chips" id="exFmt">${fmts.map(([k, l]) => `<button class="chip${f === k ? ' on' : ''}" data-f="${k}">${l}</button>`).join('')}</div>
    ${ras && f !== 'pdf' || f === 'pdf' ? `<div class="row" style="margin-top:14px"><div class="fld" style="flex:none"><span>Size</span><div class="chips" id="exScale">${[1, 2, 3].filter(k => k <= Math.max(1, maxK)).map(k => `<button class="chip${exOpt.scale === k ? ' on' : ''}" data-s="${k}">${k}×</button>`).join('')}</div></div>
      <span class="hint" style="align-self:flex-end">${Math.round(doc.w * exOpt.scale)} × ${Math.round(doc.h * exOpt.scale)} px</span></div>` : ''}

    ${(f === 'png' || f === 'svg') ? `<label class="row" style="margin-top:12px"><input type="checkbox" id="exT"${exOpt.transparent ? ' checked' : ''}> Transparent background</label>` : ''}
    ${multi && f !== 'json' && f !== 'pdf' ? `<div class="row" style="margin-top:12px"><div class="chips" id="exPages"><button class="chip${exOpt.pages === 'cur' ? ' on' : ''}" data-p="cur">This page</button><button class="chip${exOpt.pages === 'all' ? ' on' : ''}" data-p="all">All pages (.zip)</button></div></div>` : ''}
    <p class="hint" style="margin-top:12px">${f === 'svg' ? 'SVG keeps shapes and text editable. Text uses font names, so viewers need those fonts installed.' : f === 'json' ? 'A project file keeps every page and image, and reopens in Pasteboard via My designs → Import.' : f === 'pdf' ? 'Each page becomes one PDF page' + (doc.dpi > 96 ? ` at ${doc.dpi} dpi.` : '.') : 'Renders at full resolution.'}</p>
    <div class="foot"><button class="btn line" data-close>Close</button><button class="btn primary" id="exGo">${ic('download')} Download</button></div>`;

async function runExport() {
  const go = $('#exGo'); go.disabled = true; go.textContent = 'Preparing…';
  const o = exOpt, base = fname(); const list = o.pages === 'all' && doc.pages.length > 1 ? doc.pages.map((p, i) => [p, i]) : [[page(), cur]];
  try {
    await document.fonts.ready;
    if (o.fmt === 'json') await saveFile(base + '.pasteboard.json', new Blob([JSON.stringify(serialize())], { type: 'application/json' }));
    else if (o.fmt === 'pdf') {
      const out = [];
      for (const pg of doc.pages) { const c = await renderToCanvas(pg, o.scale, false, true), b = await toBlob(c, 'image/jpeg', o.q / 100); out.push({ jpg: new Uint8Array(await b.arrayBuffer()), w: c.width, h: c.height, pw: doc.w * 72 / doc.dpi, ph: doc.h * 72 / doc.dpi }); }
      await saveFile(base + '.pdf', await buildPDF(out));
    } else {
      const files = [];
      for (const [pg, i] of list) {
        const nm = base + (list.length > 1 ? '-' + (i + 1) : '') + '.' + o.fmt;
        if (o.fmt === 'svg') files.push({ name: nm, bytes: new TextEncoder().encode(toSVG(pg, doc.w, doc.h, o.transparent)) });

}

/* ---------- save / open ---------- */
const LS = { idx: 'pb.index', doc: id => 'pb.doc.' + id, last: 'pb.last' };
const lsGet = k => { try { return localStorage.getItem(k); } catch (e) { return null; } };
const lsSet = (k, v) => { try { localStorage.setItem(k, v); return true; } catch (e) { return false; } };
const lsDel = k => { try { localStorage.removeItem(k); } catch (e) { } };
const readIdx = () => { try { return JSON.parse(lsGet(LS.idx) || '[]'); } catch (e) { return []; } };
const serialize = () => ({ v: 1, id: doc.id, name: doc.name, w: doc.w, h: doc.h, dpi: doc.dpi, pages: JSON.parse(JSON.stringify(doc.pages, (k, v) => k[0] === '_' ? undefined : v)), assets: doc.assets });
function markDirty() { dirty = true; $('#saveState').textContent = 'Unsaved'; clearTimeout(markDirty.t); markDirty.t = setTimeout(() => saveNow(), 1500); }
function makeThumb() { const th = document.createElement('canvas'), k = Math.min(160 / doc.w, 120 / doc.h); th.width = Math.round(doc.w * k); th.height = Math.round(doc.h * k); renderPage(th.getContext('2d'), doc.pages[0], doc.w, doc.h, k); return th.toDataURL('image/jpeg', .6); }
function saveNow(manual, noCloud) {
  clearTimeout(markDirty.t); if (!doc) return;
  const thumb = makeThumb(), ok = lsSet(LS.doc(doc.id), JSON.stringify(serialize()));
  if (!ok) { $('#saveState').textContent = 'Not saved'; toast('Browser storage is full. Sign in to save online, or export a project file.'); if (!noCloud) cloudSync(thumb); return; }
  const idx = readIdx().filter(d => d.id !== doc.id); idx.unshift({ id: doc.id, name: doc.name, w: doc.w, h: doc.h, t: Date.now(), thumb });
  lsSet(LS.idx, JSON.stringify(idx)); lsSet(LS.last, doc.id); dirty = false;
  $('#saveState').textContent = 'Saved'; if (manual) toast(cloudReady() ? 'Saved' : 'Saved in this browser');
  if (!noCloud) cloudSync(thumb);
}
function loadDoc(d) {
  closeEdit(true); doc = d; cur = 0; sel = []; imgCache.clear(); setTool('select');
  $('#docName').value = doc.name; layoutBoard(); fitZoom(); histReset(); refreshAll(); showTab('props');
  lsSet(LS.last, doc.id); $('#saveState').textContent = '';

/* ---------- toolbar + keyboard ---------- */
$$('#tools [data-tool]').forEach(b => b.onclick = () => setTool(b.dataset.tool));
$('#btnUndo').onclick = undo; $('#btnRedo').onclick = redo;
$('#zoomIn').onclick = () => setZoom(zoom * 1.25); $('#zoomOut').onclick = () => setZoom(zoom / 1.25); $('#zoomFit').onclick = fitZoom;
$('#btnSize').onclick = openSizeModal; $('#btnOpen').onclick = openDesigns; $('#btnSave').onclick = () => saveNow(true); $('#btnExport').onclick = openExportModal;
$('#docName').addEventListener('input', e => { doc.name = e.target.value || 'Untitled design'; markDirty(); });
window.addEventListener('resize', () => { clearTimeout(window._rz); window._rz = setTimeout(() => { if (doc) fitZoom(); }, 150); });
window.addEventListener('keydown', e => {
  const t = e.target, typing = t.tagName === 'TEXTAREA' || t.tagName === 'SELECT' || (t.tagName === 'INPUT' && !['range', 'color', 'checkbox'].includes(t.type));
  const mod = e.metaKey || e.ctrlKey, k = e.key.toLowerCase();
  if (e.key === 'Escape' && modalRoot.classList.contains('open')) return closeModal();
  if (mod && k === 's') { e.preventDefault(); return saveNow(true); }
  if (typing || modalRoot.classList.contains('open')) return;
  if (e.code === 'Space') { spaceDown = true; ov.style.cursor = 'grab'; e.preventDefault(); return; }
  if (mod && k === 'z') { e.preventDefault(); return e.shiftKey ? redo() : undo(); }
  if (mod && k === 'y') { e.preventDefault(); return redo(); }
  if (mod && k === 'd') { e.preventDefault(); return dupSel(); }

  if (mod && e.key === '[') { e.preventDefault(); return order(e.shiftKey ? 'back' : 'bwd'); }

  const map = { v: 'select', t: 'text', r: 'rect', o: 'ellipse', l: 'line' };

/* ---------- settings: site name, theme, accent ---------- */
const PREF_KEY = 'pb.prefs', PREF_DEFAULT = { name: 'Pasteboard', theme: 'system', accent: '' };
let prefs = { ...PREF_DEFAULT };
try { Object.assign(prefs, JSON.parse(lsGet(PREF_KEY) || '{}')); } catch (e) { }
const ACCENTS = ['#E5530F', '#2F6BFF', '#14A38B', '#E63B7A', '#8E5CF7', '#D99A00', '#D32F2F'];

function applyPrefs() {
  const nm = (prefs.name || '').trim() || 'Pasteboard', r = document.documentElement;
  $('#brandName').textContent = nm; document.title = nm;
  if (prefs.theme === 'light' || prefs.theme === 'dark') r.setAttribute('data-theme', prefs.theme); else r.removeAttribute('data-theme');

  } else ['--accent', '--accent-ink', '--accent-soft'].forEach(p => r.style.removeProperty(p));

}
const savePrefs = () => lsSet(PREF_KEY, JSON.stringify(prefs));
function openSettings() {

    <label class="fld"><span>Site name</span><input class="txt" type="text" id="sName" maxlength="30" value="${esc(prefs.name)}"></label>
    <div class="fld" style="margin-top:14px"><span>Theme</span><div class="chips" id="sTheme">${[['system', 'System'], ['light', 'Light'], ['dark', 'Dark']].map(([k, l]) => `<button class="chip${prefs.theme === k ? ' on' : ''}" data-t="${k}">${l}</button>`).join('')}</div></div>
    <div class="fld" style="margin-top:14px"><span>Accent color</span><div class="row">${ACCENTS.map(c => `<button class="btn" style="width:28px;height:28px;min-width:28px;padding:0;border-radius:50%;border:2px solid ${(prefs.accent || '').toLowerCase() === c.toLowerCase() ? 'var(--ink)' : 'var(--line)'};background:${c}" data-a="${c}" aria-label="${c}"></button>`).join('')}

    <div class="foot"><button class="btn primary" data-close>Done</button></div>`);
    $('#sName').oninput = e => { prefs.name = e.target.value; applyPrefs(); savePrefs(); };

$('#btnSettings').onclick = openSettings; $('#btnAccount').onclick = openAccount;

/* ---------- start ---------- */
(function init() {

  const fam = [['400', 'Instrument Sans'], ['600', 'Instrument Sans'], ['700', 'Bricolage Grotesque'], ['800', 'Bricolage Grotesque'], ['400', 'Bebas Neue'], ['600', 'Oswald'], ['400', 'Oswald'], ['400', 'Montserrat'], ['800', 'Montserrat'], ['700', 'Playfair Display'], ['400', 'DM Serif Display'], ['400', 'Lora'], ['400', 'Pacifico'], ['500', 'Caveat'], ['400', 'Space Mono']];
  Promise.all(fam.map(([w, f]) => document.fonts.load(`${w} 40px "${f}"`).catch(() => null))).then(() => { redraw(); renderPagesNow(); drawTemplateThumbs(); });
  document.fonts.ready.then(() => { redraw(); renderPagesNow(); });
  window.matchMedia('(prefers-color-scheme: dark)').addEventListener('change', () => redraw());
